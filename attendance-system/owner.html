<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Owner · Gobir Digital</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#0a1733" />
<link rel="icon" href="gobir-icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="gobir-icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Gobir Owner" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
<style>
:root{--navy:#0a1733;--navy2:#13284d;--blue:#1f8fef;--blue2:#46b3ff;--ok:#1fb67a;--red:#ef4b5b;--line:rgba(255,255,255,.14);--muted:#9fb4d0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;font-family:'Inter',system-ui,sans-serif;color:#eaf2fb;
  background:radial-gradient(1000px 500px at 50% -10%,rgba(31,143,239,.22),transparent),linear-gradient(180deg,#0a1733,#0e1f3d);
  display:flex;align-items:center;justify-content:center;padding:20px;-webkit-tap-highlight-color:transparent}
.card{width:100%;max-width:400px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.45);text-align:center}
.logo{width:72px;height:72px;border-radius:18px;margin:0 auto 14px;display:block;box-shadow:0 8px 20px rgba(0,0,0,.4)}
h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 22px}
label{display:block;text-align:left;font-size:.82rem;font-weight:600;margin:0 0 6px;color:#cfe0f5}
input{width:100%;border:1.5px solid var(--line);background:rgba(255,255,255,.07);color:#fff;border-radius:12px;padding:14px;font-size:1.05rem;text-align:center;letter-spacing:.1em}
input:focus{outline:none;border-color:var(--blue2);box-shadow:0 0 0 3px rgba(70,179,255,.25)}
.btn{width:100%;border:none;border-radius:999px;padding:15px;font:700 1.05rem 'Inter';cursor:pointer;margin-top:14px;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:transform .15s,box-shadow .2s,opacity .2s;color:#fff}
.btn:active{transform:scale(.98)}
.btn-blue{background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 12px 28px rgba(31,143,239,.4)}
.btn-red{background:linear-gradient(135deg,#e23b4c,#ff6676);box-shadow:0 12px 28px rgba(239,75,91,.4)}
.btn-ok{background:linear-gradient(135deg,#17a06c,#28c98a);box-shadow:0 12px 28px rgba(31,182,122,.4)}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.status{margin:6px 0 4px;padding:22px;border-radius:16px;font-weight:800;font-size:1.5rem;display:flex;align-items:center;justify-content:center;gap:10px}
.status.open{background:rgba(31,182,122,.14);border:1px solid rgba(31,182,122,.5);color:#44e3a3}
.status.closed{background:rgba(239,75,91,.14);border:1px solid rgba(239,75,91,.5);color:#ff8a95}
.msg{min-height:1.2em;font-size:.86rem;margin-top:12px;color:var(--muted)}
.msg.err{color:#ff8a95}
.hide{display:none}
.foot{margin-top:18px;font-size:.78rem;color:var(--muted)}
.foot a{color:var(--blue2);text-decoration:none}
.logout{background:none;border:none;color:var(--muted);font-size:.82rem;cursor:pointer;margin-top:8px;text-decoration:underline}
.block{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);text-align:left}
.block>b{display:block;font-size:.95rem;color:#cfe0f5;margin-bottom:6px}
.lf{text-align:left;letter-spacing:0;margin-top:4px;background:rgba(255,255,255,.07);color:#fff}
select.lf{appearance:none;-webkit-appearance:none}
.brow{display:flex;gap:10px;margin-top:12px}
.brow .btn{flex:1;margin-top:0;font-size:.95rem;padding:12px}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="gobir-logo-emblem.png" alt="Gobir Digital" />
    <h1>Owner control</h1>
    <p class="sub">Open or close bookings in one tap.</p>

    <!-- login -->
    <div id="login">
      <label for="pin">Enter your PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" />
      <button class="btn btn-blue" id="unlock"><i class="bi bi-unlock"></i> Unlock</button>
      <div class="msg" id="loginMsg"></div>
    </div>

    <!-- panel -->
    <div id="panel" class="hide">
      <div class="status" id="status"><i class="bi bi-hourglass-split"></i> Loading…</div>
      <p class="sub" id="statusHint">&nbsp;</p>
      <button class="btn" id="toggle" disabled>…</button>
      <div class="msg" id="panelMsg"></div>

      <div class="block">
        <b>Block a specific day / time</b>
        <label for="blkDate">Date</label>
        <input id="blkDate" type="date" class="lf" />
        <label for="blkTime">Time (optional)</label>
        <select id="blkTime" class="lf">
          <option value="">Whole day</option>
          <option>4:00 PM</option><option>5:00 PM</option><option>6:00 PM</option>
          <option>7:00 PM</option><option>8:00 PM</option><option>9:00 PM</option>
        </select>
        <div class="brow">
          <button class="btn btn-red" id="blkAdd"><i class="bi bi-slash-circle"></i> Block</button>
          <button class="btn btn-ok" id="blkDel"><i class="bi bi-check2-circle"></i> Unblock</button>
        </div>
        <div class="msg" id="blkMsg"></div>
      </div>

      <button class="logout" id="logout">Lock / change PIN</button>
    </div>

    <div class="foot">Bookmark this page · <a href="gobir-digital.html">View site</a></div>
  </div>

<script>
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxvoeuikW6ovZBp6axU4Tmz9GYsTOLsQAMyfjxq_Q14oOlwRkVV92zLoDOgiT4_dpo7Q/exec";
var $ = function(s){return document.querySelector(s);};
var seq=0;
function api(params){
  return new Promise(function(res,rej){
    if(!SCRIPT_URL){rej({reason:"noconfig"});return;}
    var cb="ocb"+Date.now()+(seq++), s, timer;
    function clean(){clearTimeout(timer);try{delete window[cb];}catch(e){window[cb]=undefined;}if(s&&s.parentNode)s.parentNode.removeChild(s);}
    timer=setTimeout(function(){clean();rej({reason:"timeout"});},15000);
    window[cb]=function(d){clean();res(d||{});};
    var q=Object.keys(params).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(params[k]==null?"":params[k]);}).join("&");
    s=document.createElement("script");s.src=SCRIPT_URL+"?"+q+"&callback="+cb;s.onerror=function(){clean();rej({reason:"network"});};
    document.body.appendChild(s);
  });
}
var pin="";
function showPanel(open){
  $("#login").classList.add("hide"); $("#panel").classList.remove("hide");
  var st=$("#status"), tg=$("#toggle");
  if(open){
    st.className="status open"; st.innerHTML='<i class="bi bi-check-circle-fill"></i> OPEN';
    $("#statusHint").textContent="Clients can book sessions.";
    tg.className="btn btn-red"; tg.innerHTML='<i class="bi bi-lock"></i> Close booking'; tg.dataset.next="no";
  } else {
    st.className="status closed"; st.innerHTML='<i class="bi bi-x-circle-fill"></i> CLOSED';
    $("#statusHint").textContent="New bookings are turned off.";
    tg.className="btn btn-ok"; tg.innerHTML='<i class="bi bi-unlock"></i> Open booking'; tg.dataset.next="yes";
  }
  tg.disabled=false;
}
function loadStatus(){
  $("#panelMsg").textContent="";
  api({action:"ownerstatus",pin:pin}).then(function(r){
    if(r&&r.ok){ localStorage.setItem("gobirPin",pin); showPanel(!!r.open); }
    else { lock("Wrong PIN. Try again."); }
  }).catch(function(){ $("#loginMsg").className="msg err"; $("#loginMsg").textContent="Couldn't reach the server. Check your connection."; $("#login").classList.remove("hide"); $("#panel").classList.add("hide"); });
}
function lock(msg){
  pin=""; localStorage.removeItem("gobirPin");
  $("#panel").classList.add("hide"); $("#login").classList.remove("hide");
  $("#pin").value=""; $("#loginMsg").className="msg err"; $("#loginMsg").textContent=msg||"";
}
$("#unlock").addEventListener("click",function(){
  pin=$("#pin").value.trim(); if(!pin){return;}
  $("#loginMsg").className="msg"; $("#loginMsg").textContent="Checking…"; loadStatus();
});
$("#pin").addEventListener("keydown",function(e){ if(e.key==="Enter") $("#unlock").click(); });
$("#toggle").addEventListener("click",function(){
  var tg=$("#toggle"), next=tg.dataset.next; tg.disabled=true; $("#panelMsg").className="msg"; $("#panelMsg").textContent="Updating…";
  api({action:"setopen",pin:pin,value:next}).then(function(r){
    if(r&&r.ok){ showPanel(!!r.open); $("#panelMsg").textContent="Saved ✓"; }
    else { lock("Session expired — enter PIN again."); }
  }).catch(function(){ tg.disabled=false; $("#panelMsg").className="msg err"; $("#panelMsg").textContent="Couldn't update. Try again."; });
});
// block / unblock a day or slot
(function(){ var d=$("#blkDate"); if(d){ var n=new Date(); d.min=new Date(n.getTime()-n.getTimezoneOffset()*60000).toISOString().slice(0,10); } })();
function blkLabel(){ var t=$("#blkTime").value; return $("#blkDate").value + (t?(" "+t):" (whole day)"); }
$("#blkAdd").addEventListener("click",function(){
  if(!$("#blkDate").value){$("#blkMsg").className="msg err";$("#blkMsg").textContent="Pick a date.";return;}
  $("#blkMsg").className="msg";$("#blkMsg").textContent="Blocking…";
  api({action:"setblock",pin:pin,date:$("#blkDate").value,time:$("#blkTime").value}).then(function(r){
    if(r&&r.ok){$("#blkMsg").textContent="Blocked "+blkLabel()+" ✓";}else{lock("Session expired — enter PIN again.");}
  }).catch(function(){$("#blkMsg").className="msg err";$("#blkMsg").textContent="Couldn't block. Try again.";});
});
$("#blkDel").addEventListener("click",function(){
  if(!$("#blkDate").value){$("#blkMsg").className="msg err";$("#blkMsg").textContent="Pick a date.";return;}
  $("#blkMsg").className="msg";$("#blkMsg").textContent="Unblocking…";
  api({action:"unsetblock",pin:pin,date:$("#blkDate").value,time:$("#blkTime").value}).then(function(r){
    if(r&&r.ok){$("#blkMsg").textContent="Unblocked "+blkLabel()+" ✓";}else{lock("Session expired.");}
  }).catch(function(){$("#blkMsg").className="msg err";$("#blkMsg").textContent="Couldn't unblock.";});
});
$("#logout").addEventListener("click",function(){ lock(""); });
// auto-unlock if PIN remembered on this device
(function(){ var p=localStorage.getItem("gobirPin"); if(p){ pin=p; loadStatus(); } })();
</script>
</body>
</html>
