# Root Netlify config — builds the upgraded Next.js site in /gobir-website
# (static export → served from its /out folder). Netlify builds on its own
# infra on every push, so GitHub Actions billing does not matter.

[build]
  base = "gobir-website"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
