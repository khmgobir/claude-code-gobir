name: Deploy to GitHub Pages

on:
  # Disabled auto-run: account Actions are billing-locked and the static
  # site is hosted via Netlify / the /docs branch (no Actions needed).
  # Re-enable by restoring the push trigger once billing is resolved.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: attendance-system

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
